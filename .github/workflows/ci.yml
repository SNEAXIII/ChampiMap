name: CI

# Build de l'APK release (app web embarquée) à chaque push / PR ; sur main, publication
# dans la GitHub Release roulante « latest » (APK téléchargeable depuis le téléphone).

on:
  push:
  pull_request:
  workflow_dispatch:

# Annule un run précédent encore en cours sur la même réf (push successifs).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===================================================================
  # Job 0 — Détection des chemins modifiés (gate du build)
  # ===================================================================
  # Plage de diff selon l'évènement :
  #   - pull_request : base de la PR ... HEAD
  #   - push (tip connu) : avant ... après
  #   - 1er push d'une branche / workflow_dispatch : pas de base fiable -> on
  #     reconstruit (mieux vaut un build de trop qu'un manqué).
  changes:
    name: Détecter les chemins modifiés
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculer la plage de diff
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=${{ github.event.pull_request.base.sha }}...HEAD" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "range=${{ github.event.before }}...${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "range=" >> "$GITHUB_OUTPUT"
          fi
      - name: Filtrer par périmètre
        id: filter
        run: |
          RANGE="${{ steps.range.outputs.range }}"
          if [ -z "$RANGE" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # APK : app web (embarquée dans les assets), app Android, le CI lui-même.
          APP=$(git diff --name-only "$RANGE" -- web android .github/workflows/ci.yml | wc -l)
          echo "app=$([ "$APP" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # ===================================================================
  # Job 1 — Build de l'APK release (web embarquée + Gradle)
  # ===================================================================
  android:
    name: Build APK Android
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.keystore.outputs.present }}
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      # tsc --noEmit + vite build vers android/app/src/main/assets/web (config Supabase : web/.env.production).
      - name: Build de l'app web (vérif. des types incluse)
        working-directory: web
        run: npm run build:android

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Android SDK (cmdline-tools + licences)
        uses: android-actions/setup-android@v3

      # La release est signée avec la clé debug (signingConfigs.debug = ~/.android/debug.keystore) :
      # la même que sur le PC, sinon l'APK ne s'installe pas par-dessus l'app existante et la
      # connexion Google échoue (client OAuth Android lié au SHA-1 de cette clé).
      - name: Installer la clé de signature
        id: keystore
        env:
          KS_B64: ${{ secrets.CHAMPI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            mkdir -p "$HOME/.android"
            echo "$KS_B64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret CHAMPI_KEYSTORE_BASE64 absent : APK signée avec une clé jetable, non publiée."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: lint + assembleRelease
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew lintRelease assembleRelease --no-daemon --stacktrace

      - name: Publier l'APK (artefact du run)
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  # ===================================================================
  # Job 2 — Déploiement : Release roulante « latest », sur push main uniquement,
  #         et seulement si l'APK est signée avec la vraie clé.
  # ===================================================================
  deploy:
    name: Déployer la Release (latest)
    needs: android
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.android.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # créer/mettre à jour la Release + déplacer le tag
    steps:
      - uses: actions/checkout@v4

      # action-gh-release ne déplace pas un tag existant : on pointe `latest` sur ce commit.
      - name: Déplacer le tag latest
        run: |
          git tag -f latest "${{ github.sha }}"
          git push -f origin refs/tags/latest

      - name: Récupérer l'APK
        uses: actions/download-artifact@v4
        with:
          name: app-apk
          path: dist

      - name: Nommer l'APK
        run: mv dist/app-release.apk dist/champi-map.apk

      # Crée la release `latest` au 1er passage, la met à jour ensuite (tag déplacé sur le commit
      # courant, asset remplacé). GITHUB_TOKEN suffit.
      - name: Publier / mettre à jour la Release « latest »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest (main)
          body: APK de Champi Map construite depuis ${{ github.sha }}. À installer par-dessus l'app existante.
          prerelease: false
          files: dist/champi-map.apk
